name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # ---- 构建 Tauri（NSIS 安装包，内嵌 WebView2 Bootstrapper）----
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Excel Copy ${{ github.ref_name }}"
          releaseBody: |
            ## Excel Copy ${{ github.ref_name }}

            轻量级 Excel 数据中转工具 —— 从 Excel 复制粘贴，编辑，导出为 xlsx/csv。

            ### 下载说明

            | 文件 | 说明 |
            |------|------|
            | `Excel.Copy_x64-setup.exe` | ✅ **安装版**（推荐）内嵌 WebView2，自动安装所有依赖 |
            | `Excel.Copy_x64-portable.zip` | 📦 **便携版** 解压后直接运行，需系统已有 WebView2 |

            ### 系统要求

            - Windows 10 1803+ 或 Windows 11（x64）
            - **安装版**：无需手动安装 WebView2，安装程序会自动处理
            - **便携版**：需要 WebView2 运行时（现代 Win10/11 随 Edge 自动安装）；若无法启动请先安装 [WebView2 运行时](https://developer.microsoft.com/zh-cn/microsoft-edge/webview2/#download-section)

            ### 使用方法

            1. 在 Excel 中选中单元格，按 `Ctrl+C` 复制
            2. 切换到 Excel Copy，按 `Ctrl+V` 粘贴
            3. 支持多 Sheet 页签、单元格编辑、公式等操作
            4. 编辑完成后点击「保存」，选择导出为 xlsx 或 csv
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      # ---- 打包便携版 zip ----
      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $exePath = "src-tauri\target\release\excel-copy.exe"

          if (-Not (Test-Path $exePath)) {
            Write-Error "找不到 release exe: $exePath"
            exit 1
          }

          $zipName = "Excel.Copy_${version}_x64-portable.zip"
          $stagingDir = "portable-staging"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          # 主程序
          Copy-Item $exePath "$stagingDir\Excel Copy.exe"

          # 写入便携版使用说明（含 WebView2 检测方法）
          $readme = @"
Excel Copy v${version} 便携版
================================

【使用前提】
本便携版需要系统已安装 WebView2 运行时。
现代 Windows 10/11 已通过 Microsoft Edge 自动安装，通常无需额外操作。

【如果双击 "Excel Copy.exe" 没有任何反应】
说明系统缺少 WebView2 运行时，请：
1. 访问 https://developer.microsoft.com/zh-cn/microsoft-edge/webview2/#download-section
2. 下载并安装 "常青版独立安装程序（x64）"
3. 安装完成后重新运行本程序

【推荐使用安装版】
如果不想手动安装依赖，请使用安装版（Excel.Copy_x64-setup.exe），
安装程序会自动检测并安装所需的 WebView2 运行时。

【使用方法】
1. 在 Excel 中选中单元格，按 Ctrl+C 复制
2. 双击打开 "Excel Copy.exe"
3. 按 Ctrl+V 粘贴数据
4. 编辑完成后点击「保存」导出为 xlsx 或 csv
"@
          $readme | Out-File -FilePath "$stagingDir\使用说明.txt" -Encoding UTF8

          # 写入 WebView2 检测批处理脚本
          $checkScript = @'
@echo off
chcp 65001 >nul
echo 正在检测 WebView2 运行时...
reg query "HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" >nul 2>&1
if %errorlevel% == 0 (
    echo [OK] 检测到 WebView2 运行时（系统级）
    goto :found
)
reg query "HKCU\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" >nul 2>&1
if %errorlevel% == 0 (
    echo [OK] 检测到 WebView2 运行时（用户级）
    goto :found
)
echo [错误] 未检测到 WebView2 运行时！
echo.
echo 请访问以下地址下载安装：
echo https://developer.microsoft.com/zh-cn/microsoft-edge/webview2/#download-section
echo.
echo 安装完成后重新运行 "Excel Copy.exe"
pause
exit /b 1
:found
echo.
echo 正在启动 Excel Copy...
start "" "Excel Copy.exe"
exit /b 0
'@
          $checkScript | Out-File -FilePath "$stagingDir\启动（检测WebView2）.bat" -Encoding ASCII

          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipName -Force
          $sizeMB = "{0:N2}" -f ((Get-Item $zipName).Length / 1MB)
          Write-Host "✓ 便携版打包完成: $zipName (${sizeMB} MB)"

      # ---- 上传便携版到已创建的 Release ----
      - name: Upload portable zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: "Excel.Copy_*_x64-portable.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
