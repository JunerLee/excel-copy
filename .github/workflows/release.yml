name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Excel Copy ${{ github.ref_name }}"
          releaseBody: |
            ## Excel Copy ${{ github.ref_name }}

            From Excel copy-paste to xlsx/csv export. Lightweight & fast.

            | File | Description |
            |------|-------------|
            | `Excel.Copy_x64-setup.exe` | Installer (recommended) — auto-installs WebView2 |
            | `Excel.Copy_x64-portable.zip` | Portable — requires WebView2 already installed |

            **Requirements:** Windows 10 1803+ or Windows 11 (x64)

            If portable exe does not open, install [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/) first.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $exePath = "src-tauri\target\release\excel-copy.exe"
          if (-Not (Test-Path $exePath)) { Write-Error "exe not found: $exePath"; exit 1 }
          $zipName = "Excel.Copy_${version}_x64-portable.zip"
          $stagingDir = "portable-staging"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          Copy-Item $exePath "$stagingDir\Excel Copy.exe"
          Copy-Item "portable\launch.bat" "$stagingDir\launch.bat"
          Copy-Item "portable\使用说明.txt" "$stagingDir\使用说明.txt"
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipName -Force
          Write-Host "Packaged: $zipName"

      - name: Upload portable zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: "Excel.Copy_*_x64-portable.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
