[package]
name = "excel-copy"
version = "0.4.0"
description = "Excel Copy - 轻量级表格数据中转工具"
authors = ["JunerLee"]
edition = "2021"
rust-version = "1.77"

# Windows 桌面应用只需要 bin，不需要 staticlib/cdylib
# staticlib 在 Windows MSVC 会引入 C 运行时冲突

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = "0.87.0"
csv = "1.3"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# 移除 panic = "abort"：Windows 上 abort 会完全静默，改为 unwind 可以弹出错误对话框
# 移除 strip = true：strip 在 Windows MSVC 工具链下行为不稳定
