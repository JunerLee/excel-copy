[package]
name = "excel-copy"
version = "0.6.1"
description = "Excel Copy - 轻量级表格数据中转工具"
authors = ["JunerLee"]
edition = "2021"
rust-version = "1.77"

# see: https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "excel_copy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = "0.87.0"
csv = "1.3"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
