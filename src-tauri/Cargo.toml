[package]
name = "excel-copy"
version = "0.2.0"
description = "Excel Copy - 轻量级表格数据中转工具"
authors = ["JunerLee"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "excel_copy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = "0.87.0"
csv = "1.3"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
